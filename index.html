<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMW Gestion</title>
<meta name="description" content="Gestion du Dahira Miftaahul Munnah Wassoul : adhérents, commissions, cartes, cotisations, mensualités, relances, rapports.">
<meta name="theme-color" content="#0b3d73">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-256.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MMW">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ------------------------------------------------------------------ jetons (couleurs du logo) */
:root{
  --bleu:#0b3d73;        /* anneau du logo */
  --bleu-2:#0a5f8f;      /* minaret */
  --bleu-pale:#e3edf6;
  --vert:#15803d;        /* étoile : payé */
  --vert-pale:#e1f2e6;
  --ambre:#a85f00;       /* partiel, en cours */
  --ambre-pale:#fbefdc;
  --rouge:#b42318;       /* impayé, retard */
  --rouge-pale:#fbe5e3;
  --encre:#14202c;
  --gris:#5b6875;
  --trait:#d5dde5;
  --fond:#f2f5f8;
  --surface:#ffffff;
  --ombre:0 1px 2px rgba(11,61,115,.06),0 6px 18px rgba(11,61,115,.06);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --titre:"Bricolage Grotesque",system-ui,sans-serif;
  --texte:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bleu:#8cc2ee; --bleu-2:#a9d3f3; --bleu-pale:#16283b; --vert:#5fd38a; --vert-pale:#14301f;
    --ambre:#f2b25c; --ambre-pale:#3a2a12; --rouge:#ff8a80; --rouge-pale:#3d1d1b;
    --encre:#e6edf3; --gris:#9aa7b4; --trait:#2a3644; --fond:#0e141b; --surface:#16202b; --ombre:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bleu:#8cc2ee; --bleu-2:#a9d3f3; --bleu-pale:#16283b; --vert:#5fd38a; --vert-pale:#14301f;
  --ambre:#f2b25c; --ambre-pale:#3a2a12; --rouge:#ff8a80; --rouge-pale:#3d1d1b;
  --encre:#e6edf3; --gris:#9aa7b4; --trait:#2a3644; --fond:#0e141b; --surface:#16202b; --ombre:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.5 var(--texte);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--titre);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1rem}
a{color:var(--bleu-2)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--bleu-2);outline-offset:2px}
.muted{color:var(--gris)}
.hidden{display:none!important}
small{font-size:.82rem}

/* ------------------------------------------------------------------ l'ornement : le treillis du logo */
.treillis{background-color:#0b3d73;color:#fff;}
.treillis a,.treillis button{color:#fff}

/* ------------------------------------------------------------------ structure */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:3px;overflow:auto}
.marque{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
.marque img{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;flex:none}
.marque b{display:block;font-family:var(--titre);font-size:1.15rem;line-height:1.1}
.marque span{display:block;font-size:.76rem;opacity:.8;line-height:1.25;margin-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);text-decoration:none;opacity:.84;font-weight:500}
.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.17)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:#fff;color:#0b3d73;border-radius:99px;font-size:.72rem;padding:0 7px;font-weight:600}
.nav .sep{height:1px;background:rgba(255,255,255,.14);margin:6px 8px}
.cherche-nav{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;margin:0 4px 12px;width:auto}
.cherche-nav::placeholder{color:rgba(255,255,255,.7)}
.side .bas{margin-top:auto;font-size:.82rem;padding:8px;opacity:.92}
.side .bas button{background:none;border:1px solid rgba(255,255,255,.35);border-radius:var(--r-s);padding:4px 10px;cursor:pointer;margin-top:8px}
main{min-width:0;padding:24px 28px 80px}
.entete{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.entete p{margin:4px 0 0;color:var(--gris)}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.outils select,.panneau > header select{width:auto}
td.nom{white-space:nowrap}
.mobile-top,.tabbar{display:none}
.env-test{background:#a85f00;color:#fff;text-align:center;font-size:.82rem;padding:3px;font-weight:600}

/* ------------------------------------------------------------------ éléments */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--trait);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--encre)}
.btn:hover{border-color:var(--gris)}
.btn.prim{background:#0b3d73;border-color:#0b3d73;color:#fff}
.btn.prim:hover{background:#0a5f8f}
.btn.vert{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.danger{color:var(--rouge);border-color:var(--rouge)}
.btn.petit{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.champ{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.champ > span{color:var(--gris);font-weight:500}
.champ small{color:var(--gris)}
input,select,textarea{border:1px solid var(--trait);background:var(--surface);border-radius:var(--r-s);padding:8px 10px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:70px;resize:vertical}
.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtres input[type=search]{min-width:220px}
.filtres select,.filtres input{width:auto}
.onglets{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--trait);margin-bottom:16px}
.onglets button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--gris);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.onglets button[aria-selected="true"]{color:var(--bleu);border-color:var(--bleu)}

.panneau{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-m);padding:18px;box-shadow:var(--ombre)}
.panneau > h2{margin-bottom:12px}
.panneau > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grille{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt{margin-top:16px}

.bande{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));border-radius:var(--r-l);overflow:hidden;margin:0 0 18px}
.bande > div{padding:16px 20px;border-right:1px solid rgba(255,255,255,.14)}
.bande > div:last-child{border-right:0}
.bande dt{font-size:.84rem;opacity:.85}
.bande dd{margin:4px 0 0;font-family:var(--titre);font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bande small{display:block;font-size:.78rem;opacity:.8;margin-top:4px}

.jauge{margin:12px 0}
.jauge .lig{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.jauge .barre{height:10px;background:var(--bleu-pale);border-radius:99px;overflow:hidden;margin-top:6px}
.jauge .barre i{display:block;height:100%;background:var(--bleu-2);border-radius:99px}
.jauge .chiffres{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--gris);margin-top:5px}
.jauge .chiffres b{color:var(--encre);font-weight:600}
.jauge .chiffres .rest b{color:var(--rouge)}

.gf{display:flex;gap:10px;flex-wrap:wrap}
.gf>div{flex:1;min-width:90px;background:var(--bleu-pale);border-radius:10px;padding:10px 12px}
.gf b{display:block;font-family:var(--titre);font-size:1.35rem;font-variant-numeric:tabular-nums}
.gf span{font-size:.85rem;color:var(--gris)} .gf small{float:right;font-size:.82rem;color:var(--gris);margin-top:2px}
.gf-barre{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:12px;background:var(--trait)}
.gf-barre i:first-child{background:var(--bleu-2)} .gf-barre i:last-child{background:#d6489b}
.barres-h div{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:.88rem;margin:6px 0}
.barres-h span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barres-h i{display:block;height:8px;background:var(--bleu-2);border-radius:99px;min-width:2px}
.barres-h b{text-align:right;font-variant-numeric:tabular-nums}

.tab-wrap{overflow:auto;border:1px solid var(--trait);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--trait);vertical-align:middle}
th{font-weight:600;color:var(--gris);font-size:.82rem;background:var(--surface);position:sticky;top:0;z-index:1}
th.tri{cursor:pointer;user-select:none} th.tri:hover{color:var(--encre)}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--bleu-pale) 50%,transparent)}
tr.clic{cursor:pointer}
tfoot td{font-weight:600;border-top:2px solid var(--trait)}
.vide{padding:28px;text-align:center;color:var(--gris)}

.pas{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pas.ok{background:var(--vert-pale);color:var(--vert)}
.pas.ko{background:var(--rouge-pale);color:var(--rouge)}
.pas.at{background:var(--ambre-pale);color:var(--ambre)}
.pas.bl{background:var(--bleu-pale);color:var(--bleu)}
.pas.neutre{background:var(--fond);color:var(--gris);border:1px solid var(--trait)}

/* Grille des mensualités */
.grille-mois td.m{padding:3px;text-align:center;min-width:48px}
.cel{display:block;width:100%;min-height:30px;border-radius:5px;border:0;cursor:pointer;font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.cel.st-payee_a_temps{background:var(--vert);color:#fff}
.cel.st-payee_en_retard{background:var(--vert);color:#fff;box-shadow:inset 0 -4px 0 var(--ambre)}
.cel.st-partielle,.cel.st-partielle_en_retard{background:var(--ambre-pale);color:var(--ambre);border:1px solid var(--ambre)}
.cel.st-impayee{background:var(--rouge-pale);color:var(--rouge)}
.cel.st-encours{background:var(--bleu-pale);color:var(--bleu);border:1px solid var(--bleu-2)}
.cel.st-a_venir{background:transparent;border:1px dashed var(--trait);color:var(--gris)}
.cel.hors{background:transparent;cursor:default;color:var(--trait)}
.cel:disabled{cursor:default}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--gris);margin:8px 0 14px}
.legende i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}

.coms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.com{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:10px}
.com.inactive{opacity:.55}
.com .eff{font-family:var(--titre);font-size:2rem;font-weight:700;line-height:1;color:var(--bleu)}
.com .eff small{font-family:var(--texte);font-size:.85rem;color:var(--gris);font-weight:400;margin-left:6px}
.com ul{list-style:none;padding:0;margin:0;font-size:.9rem}
.com li{display:flex;justify-content:space-between;gap:6px;padding:3px 0}
.com li em{font-style:normal;color:var(--gris);font-size:.8rem}
.com .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

.fiche-tete{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:var(--r-l);margin-bottom:16px}
.fiche-tete .ini{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--titre);font-size:1.3rem;font-weight:700}
.dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0;font-size:.92rem}
.dl dt{color:var(--gris)} .dl dd{margin:0;overflow-wrap:anywhere}

dialog{border:0;border-radius:var(--r-l);padding:0;max-width:min(580px,94vw);width:100%;background:var(--surface);color:var(--encre);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,25,45,.5)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
dialog header{display:flex;justify-content:space-between;align-items:center}
dialog header button{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--gris);line-height:1}
dialog .pied{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trois{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choix-ech{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;border:1px solid var(--trait);border-radius:var(--r-s);padding:6px}
.choix-ech label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;font-size:.9rem}
.choix-ech label:hover{background:var(--fond)}
.choix-ech .mt-r{margin-left:auto;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--encre);color:var(--surface);padding:10px 18px;border-radius:var(--r-m);z-index:99;max-width:90vw;box-shadow:var(--ombre)}
.toast.err{background:var(--rouge);color:#fff}
.alerte{padding:12px 14px;border-radius:var(--r-m);background:var(--ambre-pale);border-left:4px solid var(--ambre);margin-bottom:14px;font-size:.92rem}
.alerte.rouge{background:var(--rouge-pale);border-color:var(--rouge)}
.alerte.bleu{background:var(--bleu-pale);border-color:var(--bleu-2)}
.liste-ops{list-style:none;margin:0;padding:0}
.liste-ops li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--trait);font-size:.9rem}
.liste-ops li:last-child{border-bottom:0}
.chart{overflow-x:auto}
.chart svg{display:block}
.chart text{fill:var(--gris);font-size:11px;font-family:var(--texte)}
.rapports{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rapports article{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:8px}
.rapports p{margin:0;font-size:.88rem;color:var(--gris)}
.rapports .outils{margin-top:auto}

/* Connexion */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .gauche{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:48px;gap:20px}
.login .gauche img{width:min(260px,50vw);border-radius:50%;background:#fff;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.login .gauche h1{font-size:clamp(1.8rem,3.4vw,2.8rem);max-width:16ch;color:#fff}
.login .gauche p{max-width:38ch;opacity:.9;margin:0}
.login .droite{display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.chargement{min-height:60vh;display:grid;place-items:center;color:var(--gris)}

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5}
  .mobile-top img{width:34px;height:34px;border-radius:50%;background:#fff;padding:1px}
  .mobile-top b{font-family:var(--titre);font-size:1.1rem;margin-right:auto}
  main{padding:16px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--trait);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.7rem;color:var(--gris);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--bleu);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .bande{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .bande > div{border-bottom:1px solid rgba(255,255,255,.14)}
  .bande > div:nth-child(2n){border-right:0}
  .bande > div:last-child:nth-child(odd){grid-column:1/-1}
  .g2,.g3{grid-template-columns:minmax(0,1fr)!important}
  .dl{grid-template-columns:1fr} .dl dt{margin-top:6px}
  .login{grid-template-columns:1fr}
  .login .gauche{padding:28px 24px;align-items:center;text-align:center}
  .login .gauche img{width:140px}
  .filtres input[type=search]{min-width:0;flex:1 1 100%}
  .deux,.trois{grid-template-columns:1fr}
  h1{font-size:1.45rem}
  .barres-h div{grid-template-columns:110px 1fr 34px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="racine"><div class="chargement" id="chargementInitial">Chargement…</div></div>
<dialog id="modale"></dialog>
<script>
/* Secours au démarrage : si l'application ne s'affiche pas, on explique pourquoi au lieu de rester sur « Chargement… » */
function mmwSecours(detail) {
  var c = document.getElementById('chargementInitial'); if (!c) return;   // l'application s'est déjà affichée
  c.innerHTML = '<div style="max-width:520px;text-align:center;line-height:1.5;padding:16px">'
    + '<p style="font-weight:600;color:#0b3d73;font-size:1.1rem">L\'application n\'a pas pu démarrer.</p>'
    + '<p>' + (detail || 'Vérifiez votre connexion internet.') + '</p>'
    + '<p><button onclick="location.reload()" style="padding:10px 16px;margin:4px;border-radius:8px;border:0;background:#0b3d73;color:#fff;cursor:pointer">Réessayer</button>'
    + '<button onclick="mmwReinit()" style="padding:10px 16px;margin:4px;border-radius:8px;border:1px solid #0b3d73;background:#fff;color:#0b3d73;cursor:pointer">Ressaisir l\'URL et la clé Supabase</button></p></div>';
}
function mmwReinit() {
  try { Object.keys(localStorage).forEach(function (k) { if (/^mmw_cfg_|^mmw-auth-/.test(k)) localStorage.removeItem(k); }); } catch (e) {}
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); }); } catch (e) {}
  location.href = location.pathname;
}
window.addEventListener('error', function (e) {
  var m = String(e.message || '');
  var conseil = /Syntax|Unexpected|Invalid or unexpected/.test(m)
    ? 'Le fichier index.html a été abîmé en le modifiant (souvent une apostrophe effacée ou en trop autour de l\'URL ou de la clé). Remettez la ligne « production » exactement comme ceci, avec vos valeurs :<br><code style="font-size:.85rem">production: { SUPABASE_URL: \'https://xxxx.supabase.co\', SUPABASE_ANON_KEY: \'eyJ…\' },</code>'
    : 'Erreur : ' + m.replace(/[<>&]/g, '');
  mmwSecours(conseil);
});
setTimeout(function () { mmwSecours('Le démarrage prend trop de temps. Vérifiez votre connexion internet, puis réessayez. Si cela continue, ressaisissez l\'URL et la clé Supabase.'); }, 15000);
</script>

<script>
/* =====================================================================
   CONFIGURATION
   - production : le projet Supabase réel
   - test       : un second projet Supabase pour essayer sans risque (facultatif)

  const d = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const c100 = x => { if (x < 20) return u[x]; const dz = Math.floor(x / 10), un = x % 10;
    if (dz === 7 || dz === 9) return d[dz] + (dz === 7 && un === 1 ? '-et-' : '-') + u[10 + un];
    if (un === 0) return d[dz] + (dz === 8 ? 's' : ''); if (un === 1 && dz !== 8) return d[dz] + '-et-un'; return d[dz] + '-' + u[un]; };
  const c1000 = x => { const c = Math.floor(x / 100), r = x % 100; let s = c === 0 ? '' : c === 1 ? 'cent' : u[c] + '-cent' + (r === 0 ? 's' : ''); if (r) s += (s ? '-' : '') + c100(r); return s; };
  const p = [], mds = Math.floor(n / 1e9), mns = Math.floor(n % 1e9 / 1e6), mil = Math.floor(n % 1e6 / 1000), r = n % 1000;

  const mens = ech.filter(x => x.nature === 'mensualite' && x.exercice_id === eM?.id).sort((a, b) => a.mois.localeCompare(b.mois));
  const sass = ech.filter(x => x.nature === 'sass' && x.exercice_id === eC?.id).sort((a, b) => a.tranche - b.tranche);

  return `<button class="btn petit" data-export="${id}" data-fmt="xlsx">${ico('dl')} Excel</button><button class="btn petit" data-export="${id}" data-fmt="csv">CSV</button>${pdf ? `<button class="btn petit" data-export="${id}" data-fmt="pdf">${ico('print')} PDF</button>` : ''}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-export]'); if (!b) return;
  const f = EXPORTS[b.dataset.export]; if (!f) return;
  const r = f(); const feuilles = r.feuilles || [{ nom: r.titre || r.nom, entetes: r.entetes, lignes: r.lignes }];
  if (b.dataset.fmt === 'csv') exporterCSV(r.nom, feuilles[0].entetes, feuilles[0].lignes);
  else if (b.dataset.fmt === 'pdf') imprimerTableaux(r.titre || r.nom, feuilles, r.intro);
  else exporterXLSX(r.nom, feuilles);
});

let LOGO_DATA = null;
fetch('logo-256.png').then(r => r.ok ? r.blob() : null).then(b => { if (!b) return; const fr = new FileReader(); fr.onload = () => LOGO_DATA = fr.result; fr.readAsDataURL(b); }).catch(() => {});
const LOGO_URL = () => LOGO_DATA || new URL('logo-256.png', location.href).href;

  if (!w) { toast('Autorisez les fenêtres pop-up pour imprimer.', true); return; }
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${h(titre)}</title>
  <style>body{font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#14202c;margin:0;padding:28px}
  .tete{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0b3d73;padding-bottom:10px;margin-bottom:16px}.tete img{width:64px;height:64px}
  .tete b{font-size:17px;color:#0b3d73;display:block}.tete small{color:#5b6875}h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 6px;color:#0b3d73}
  table{width:100%;border-collapse:collapse;margin:6px 0 12px}th,td{border-bottom:1px solid #d5dde5;padding:5px 6px;text-align:left}th{background:#e3edf6;font-size:11.5px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tfoot td{font-weight:700;border-top:2px solid #0b3d73}.pied{margin-top:24px;color:#5b6875;font-size:11px}
  @media print{body{padding:0}.noprint{display:none}thead{display:table-header-group}tr{break-inside:avoid}}</style></head><body>
  <div class="tete"><img src="${LOGO_URL()}" alt=""><div><b>${h(nomAsso())}</b><small>${h(param('devise'))}</small></div></div>
  ${corps}<p class="pied">Édité le ${new Date().toLocaleString('fr-FR')} par ${h(S.profil?.nom || S.user?.email || '')} — MMW Gestion</p>
  <p class="noprint" style="text-align:center"><button onclick="print()" style="padding:8px 16px">Imprimer / enregistrer en PDF</button></p></body></html>`);
  w.document.close();
}
function tableHTML(f) {
  const estNum = i => f.lignes.length && f.lignes.every(l => typeof l[i] === 'number' || l[i] === '' || l[i] == null);
  const nums = f.entetes.map((_, i) => estNum(i));
  const cell = (v, i) => `<td${nums[i] ? ' class="n"' : ''}>${typeof v === 'number' && nums[i] && !/^(N°|Matricule|Mois dus|Nb|Effectif|Membres|Soldées|Payés|Impayés|Nombre)/i.test(f.entetes[i]) ? fcfa(v) : h(v)}</td>`;
  return `<table><thead><tr>${f.entetes.map((e, i) => `<th${nums[i] ? ' class="n"' : ''}>${h(e)}</th>`).join('')}</tr></thead><tbody>${f.lignes.map(l => `<tr>${l.map(cell).join('')}</tr>`).join('')}</tbody></table>`;
}
function imprimerTableaux(titre, feuilles, intro = '') {
  fenetreImpression(titre, `<h1>${h(titre)}</h1>${intro ? `<p>${intro}</p>` : ''}${feuilles.map(f => (feuilles.length > 1 ? `<h2>${h(f.nom)}</h2>` : '') + tableHTML(f)).join('')}`);
}

function imprimerRecu(paiement) {
  const p = paiement, m = S.idx.membre.get(p.membre_id);
  const ex = S.exercices.find(x => x.id === p.exercice_id);
  const imps = (S.idx.impParPay.get(p.id) || []).map(i => ({ i, e: S.idx.echId.get(i.echeance_id) })).filter(x => x.e);
  const lib = x => x.e.nature === 'mensualite' ? 'Mensualité ' + moisLong(x.e.periode) : (tranches(ex)[x.e.tranche - 1]?.libelle || x.e.periode) + ' — cotisation annuelle ' + (ex?.libelle || '');
  const lignes = imps.length ? imps.map(x => `<tr><td>${h(lib(x))}</td><td class="n">${fcfa(x.i.montant)}</td></tr>`).join('')
    : `<tr><td>${h(NATURES[p.nature])}${p.periode_libelle && p.nature === 'autre' ? ' — ' + h(p.periode_libelle) : ''}</td><td class="n">${fcfa(p.montant)}</td></tr>`;
  fenetreImpression('Reçu ' + p.recu_numero, `
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h1>Reçu de paiement</h1><b style="font-size:16px">N° ${h(p.recu_numero)}</b></div>
    ${p.annule ? `<p style="color:#b42318;font-weight:700;border:2px solid #b42318;display:inline-block;padding:4px 10px">ANNULÉ — ${h(p.motif_annulation || '')}</p>` : ''}
    <p>Reçu de <b>${h(nomComplet(m))}</b> — matricule ${h(m?.matricule)} — commission ${h(S.idx.com.get(m?.commission_id)?.nom || '—')}</p>
    <table><thead><tr><th>Objet</th><th class="n">Montant</th></tr></thead><tbody>${lignes}</tbody>
    <tfoot><tr><td>Total encaissé</td><td class="n">${fcfa(p.montant)}</td></tr></tfoot></table>
    <p><i>Arrêté le présent reçu à la somme de ${enLettres(p.montant)} francs CFA.</i></p>
    <p>Date : ${dateFr(p.date_paiement)} · Mode : ${h(p.mode)}${p.reference ? ' · Réf. ' + h(p.reference) : ''}<br>Enregistré par : ${h(quiNom(p.created_by))}${p.observation ? '<br>Observation : ' + h(p.observation) : ''}</p>
    <div style="display:flex;justify-content:space-between;margin-top:40px;color:#5b6875"><span>Le membre</span><span>Le trésorier</span></div>`);
}

/* ===================================================================== modale */
function modale(titre, corps, { valider = 'Enregistrer', onSubmit, danger = false, large = false } = {}) {
  const d = $('#modale');
  d.style.maxWidth = large ? 'min(860px,96vw)' : '';
  d.innerHTML = `<form method="dialog" novalidate><header><h2>${h(titre)}</h2><button type="button" aria-label="Fermer" data-fermer>×</button></header>${corps}
  <div class="pied"><button type="button" class="btn" data-fermer>Fermer</button>${onSubmit ? `<button class="btn ${danger ? 'danger' : 'prim'}" type="submit">${h(valider)}</button>` : ''}</div></form>`;
  $$('[data-fermer]', d).forEach(b => b.onclick = () => d.close());
  const f = $('form', d);
  f.onsubmit = async ev => {
    ev.preventDefault(); if (!onSubmit) return d.close();
    const req = $$('[required]', f).find(i => !String(i.value).trim() && !i.closest('.hidden'));
    if (req) { req.focus(); toast('Champ obligatoire : ' + (req.closest('.champ')?.querySelector('span')?.textContent || ''), true); return; }
    const btn = $('button[type=submit]', f); btn.disabled = true;
    try { const r = await onSubmit(Object.fromEntries(new FormData(f)), f); if (r !== false) d.close(); }
    catch (e) { erreur(e); } finally { btn.disabled = false; }
  };
  d.showModal();
  setTimeout(() => $('input:not([type=hidden]):not([type=checkbox]),select,textarea', f)?.focus(), 30);
  return f;
}
const champ = (lbl, input, aide = '') => `<label class="champ"><span>${h(lbl)}</span>${input}${aide ? `<small>${aide}</small>` : ''}</label>`;
const opts = (arr, sel, vide) => (vide !== undefined ? `<option value="">${h(vide)}</option>` : '') + arr.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${h(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${h(l)}</option>`; }).join('');
const optsMembres = (sel, vide = '— Choisir un membre —') => opts(S.membres.filter(m => m.statut === 'actif' || m.id === sel).map(m => [m.id, `${nomComplet(m)} — ${m.matricule}`]), sel, vide);
const optsCommissions = (sel, type) => opts(S.commissions.filter(c => (c.actif || c.id === sel) && (!type || c.type === type)).map(c => [c.id, c.nom]), sel, '— Aucune —');
const libPeriode = e => e.libelle + (e.actif ? ' (en cours)' : '') + (e.cloture ? ' — clôturée' : '');
const optsExos = (sel, type) => opts(S.exercices.filter(e => !type || e.type === type).map(e => [e.id, libPeriode(e)]), sel);
const typeDe = nature => nature === 'sass' ? 'cotisation' : 'mensualites';

/* ===================================================================== écritures */
async function rafraichir(msg) { await charger(); if (msg) toast(msg); router(); }
async function ins(table, rows) { const { data, error } = await S.sb.from(table).insert(rows).select(); if (error) throw error; return data; }
async function maj(table, id, vals, cle = 'id') { const { data, error } = await S.sb.from(table).update(vals).eq(cle, id).select(); if (error) throw error; return data; }
async function rpc(fn, args) { const { data, error } = await S.sb.rpc(fn, args); if (error) throw error; return data; }

function encaisser(membreId, preset = {}) {
  const partielsOk = param('paiements_partiels', 'true') === 'true';
  const f = modale('Encaisser', `
    ${champ('Membre', `<select name="membre_id" required>${optsMembres(membreId)}</select>`)}
    <div class="deux">${champ('Nature de la recette', `<select name="nature">${opts(Object.entries(NATURES), preset.nature || 'mensualite')}</select>`)}
      ${champ('Période', `<select name="exercice_id">${optsExos(preset.exercice || (preset.nature === 'sass' ? camp() : exoM())?.id, typeDe(preset.nature || 'mensualite'))}</select>`)}</div>
    <div data-pour="ech">${champ('Échéances réglées par ce paiement', '<div class="choix-ech" id="choixEch"></div>', 'Le montant est affecté dans l\'ordre, de la plus ancienne à la plus récente.')}</div>
    <div data-pour="autre">${champ('Objet', '<input name="libelle" placeholder="ex. participation Magal, don…">')}</div>
    <div class="deux">${champ('Montant encaissé (FCFA)', '<input name="montant" type="number" min="1" step="1" required inputmode="numeric">', `<span id="infoMt"></span>`)}
      ${champ('Date du paiement', `<input name="date_paiement" type="date" value="${AUJ}" max="${AUJ}" min="2020-01-01" required>`)}</div>
    <div class="deux">${champ('Mode de paiement', `<select name="mode">${opts(MODES)}</select>`)}${champ('Référence de transaction', '<input name="reference" placeholder="n° Wave, OM… (si existant)">')}</div>
    ${champ('Observation', '<input name="observation">')}
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="imprimer" checked> Ouvrir le reçu après l'enregistrement</label>`, {
    valider: 'Encaisser', onSubmit: async v => {
      const montant = Math.round(Number(v.montant));
      if (!(montant > 0)) throw new Error('Saisissez un montant supérieur à zéro.');
      if (v.date_paiement > AUJ) throw new Error('La date ne peut pas être dans le futur.');
      const ech = $$('#choixEch input:checked', f).map(i => Number(i.value));
      if (['mensualite', 'sass'].includes(v.nature)) {
        if (!ech.length) throw new Error('Cochez au moins une échéance.');
        const du = somme(ech, id => S.idx.echId.get(id).reste);
        if (montant > du) throw new Error(`Le montant dépasse le reste dû sur les échéances cochées (${fcfa(du)}).`);
        if (!partielsOk && montant !== du) throw new Error(`Les paiements partiels ne sont pas autorisés : montant attendu ${fcfa(du)}.`);
      }
      const mm = S.idx.membre.get(v.membre_id);
      if (!confirm(`Confirmer l'encaissement de ${fcfa(montant)} (${NATURES[v.nature]}) pour ${nomComplet(mm)} ?`)) return false;
      const p = await rpc('enregistrer_paiement', { p_membre: v.membre_id, p_nature: v.nature, p_montant: montant, p_date: v.date_paiement, p_mode: v.mode,
        p_exercice: Number(v.exercice_id) || null, p_echeances: ech.length ? ech : null, p_reference: v.reference || null, p_observation: v.observation || null, p_libelle: v.libelle || null });
      await rafraichir(`Encaissement enregistré : ${fcfa(montant)} — reçu ${p.recu_numero}`);
      if (v.imprimer) imprimerRecu(S.idx.payId.get(p.id) || p);
    }
  });
  const majForm = () => {
    const nat = f.nature.value; const mm = S.idx.membre.get(f.membre_id.value);
    const typ = typeDe(nat); const courant = S.exercices.find(x => x.id === Number(f.exercice_id.value));
    if (!courant || courant.type !== typ) f.exercice_id.innerHTML = optsExos((typ === 'cotisation' ? camp() : exoM())?.id, typ);
    const ex = S.exercices.find(x => x.id === Number(f.exercice_id.value));
    $('[data-pour=ech]', f).classList.toggle('hidden', !['mensualite', 'sass'].includes(nat));
    $('[data-pour=autre]', f).classList.toggle('hidden', nat !== 'autre');
    $('#infoMt', f).textContent = '';
    if (!mm) { $('#choixEch', f).innerHTML = '<span class="muted">Choisissez un membre.</span>'; return; }
    if (nat === 'carte') {
      f.montant.value = param('montant_carte', 1000);
      const s = situation(mm); if (s.carte) $('#infoMt', f).textContent = 'Attention : carte déjà payée (' + s.carte.recu_numero + ').';
      return;
    }
    if (nat === 'autre') { f.montant.value = ''; return; }
    const ouvertes = (S.idx.ech.get(mm.id) || []).filter(e => e.exercice_id === ex?.id && e.nature === nat && !e.annulee && e.reste > 0).sort((a, b) => a.date_limite.localeCompare(b.date_limite));
    if (!ouvertes.length) { $('#choixEch', f).innerHTML = '<span class="muted">Aucune échéance restant due sur cette période.</span>'; f.montant.value = ''; return; }
    const coche = e => preset.echeance ? e.id === preset.echeance : (echu(e) || e.periode === moisCourant || (nat === 'sass' && e === ouvertes[0]));
    $('#choixEch', f).innerHTML = ouvertes.map(e => `<label><input type="checkbox" value="${e.id}" ${coche(e) ? 'checked' : ''}>
      <span>${e.nature === 'mensualite' ? moisLong(e.periode) : h(tranches(ex)[e.tranche - 1].libelle)} <small class="muted">· limite ${dateFr(e.date_limite)}</small></span>
      <span class="mt-r">${e.paye ? `<small class="muted">${fcfa(e.paye)} déjà versés · </small>` : ''}${fcfa(e.reste)}</span>${pastille(e.statut)}</label>`).join('');
    if (!$('#choixEch input:checked', f)) $('#choixEch input', f).checked = true;
    const recalc = () => { const du = somme($$('#choixEch input:checked', f), i => S.idx.echId.get(Number(i.value)).reste); f.montant.value = du || ''; f.montant.max = du; $('#infoMt', f).textContent = du ? `Reste dû sur la sélection : ${fcfa(du)}${partielsOk ? ' (paiement partiel possible)' : ''}` : ''; };
    $$('#choixEch input', f).forEach(i => i.onchange = recalc); recalc();
  };
  ['nature', 'membre_id', 'exercice_id'].forEach(n => f[n].addEventListener('change', majForm));
  majForm();
}

function detailPaiement(p) {
  const m = S.idx.membre.get(p.membre_id);
  const imps = (S.idx.impParPay.get(p.id) || []).map(i => [i, S.idx.echId.get(i.echeance_id)]);
  modale('Encaissement ' + p.recu_numero, `<dl class="dl">
    <dt>Membre</dt><dd><a href="#/membre/${m?.id}" data-fermer>${h(nomComplet(m))}</a> (${h(m?.matricule)})</dd>
    <dt>Nature</dt><dd>${h(NATURES[p.nature])} — ${h(p.periode_libelle || '')}</dd>
    <dt>Montant</dt><dd><b>${fcfa(p.montant)}</b></dd>
    ${imps.length ? `<dt>Affecté à</dt><dd>${imps.map(([i, e]) => `${e ? (e.nature === 'mensualite' ? moisLong(e.periode) : e.periode) : '?'} : ${fcfa(i.montant)}`).join('<br>')}</dd>` : ''}
    <dt>Date · mode</dt><dd>${dateFr(p.date_paiement)} · ${h(p.mode)}${p.reference ? ' · réf. ' + h(p.reference) : ''}</dd>
    <dt>Enregistré par</dt><dd>${h(quiNom(p.created_by))} le ${new Date(p.created_at).toLocaleString('fr-FR')}${p.source === 'import' ? ' (reprise Excel)' : ''}</dd>
    ${p.observation ? `<dt>Observation</dt><dd>${h(p.observation)}</dd>` : ''}
    <dt>Statut</dt><dd>${p.annule ? `<span class="pas ko">Annulé</span> le ${dateFr(p.annule_le)} par ${h(quiNom(p.annule_par))} — ${h(p.motif_annulation || '')}` : '<span class="pas ok">Valide</span>'}</dd></dl>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn" id="btRecu">${ico('print')} Reçu</button>
    ${!p.annule && peut.argent() ? '<button type="button" class="btn danger" id="btAnnul">Annuler cet encaissement</button>' : ''}</div>`);
  $('#btRecu').onclick = () => imprimerRecu(p);
  $('#btAnnul')?.addEventListener('click', () => annulerPaiement(p));
  $$('#modale a[data-fermer]').forEach(a => a.onclick = () => $('#modale').close());
}
function annulerPaiement(p) {
  modale('Annuler l\'encaissement', `<p>${h(NATURES[p.nature])} de ${fcfa(p.montant)} — reçu ${h(p.recu_numero)}.</p>
    <p class="muted" style="margin:0">L'encaissement reste dans le journal avec la mention « Annulé », la date, votre nom et le motif. Les échéances qu'il réglait redeviennent dues. Pour corriger, ressaisissez ensuite le bon encaissement.</p>
    ${champ('Motif de l\'annulation', '<input name="motif" required placeholder="ex. erreur de montant, doublon…">')}`,
    { valider: 'Annuler l\'encaissement', danger: true, onSubmit: async v => { await maj('paiements', p.id, { annule: true, motif_annulation: v.motif }); await rafraichir('Encaissement annulé (tracé dans le journal)'); } });
}
function detailEcheance(e) {
  const m = S.idx.membre.get(e.membre_id);
  const imps = S.idx.impParEch.get(e.id) || [];
  modale((e.nature === 'mensualite' ? 'Mensualité ' + moisLong(e.periode) : 'Cotisation — ' + e.periode) + ' — ' + nomComplet(m), `<dl class="dl">
    <dt>Montant dû</dt><dd>${fcfa(e.montant_du)}</dd><dt>Date limite</dt><dd>${dateFr(e.date_limite)}</dd>
    <dt>Payé</dt><dd>${fcfa(e.paye)}</dd><dt>Reste</dt><dd>${fcfa(e.reste)}</dd><dt>Statut</dt><dd>${pastille(e.statut)}</dd>
    <dt>Paiements</dt><dd>${imps.map(i => { const p = S.idx.payId.get(i.paiement_id); return p ? `<a href="#" data-voirpay="${p.id}">${h(p.recu_numero)}</a> · ${dateFr(p.date_paiement)} · ${fcfa(i.montant)}${p.annule ? ' (annulé)' : ''}` : ''; }).join('<br>') || '—'}</dd></dl>
    ${e.reste > 0 && peut.argent() ? `<button type="button" class="btn vert" id="btEncE" style="align-self:flex-start">Encaisser ${fcfa(e.reste)}</button>` : ''}`);
  $('#btEncE')?.addEventListener('click', () => encaisser(e.membre_id, { nature: e.nature, exercice: e.exercice_id, echeance: e.id }));
  $$('#modale [data-voirpay]').forEach(a => a.onclick = ev => { ev.preventDefault(); detailPaiement(S.idx.payId.get(a.dataset.voirpay)); });
}

/* ===================================================================== vues */
const VUES = {};
const page = (titre, sous, outils, corps) => `<div class="entete"><div><h1>${h(titre)}</h1>${sous ? `<p>${sous}</p>` : ''}</div><div class="outils">${outils || ''}</div></div>${corps}`;
const selAnnee = () => `<select data-choix="mensualites" aria-label="Année des mensualités">${opts(annees().map(e => [e.id, libPeriode(e)]), exoM()?.id)}</select>`;
const selCamp = () => `<select data-choix="cotisation" aria-label="Campagne de cotisation">${opts(campagnes().map(e => [e.id, 'Cotisation ' + libPeriode(e)]), camp()?.id)}</select>`;
const recherche = (id, val, ph = 'Rechercher un membre') => `<input type="search" id="${id}" placeholder="${ph}" value="${h(val)}" aria-label="Rechercher">`;
function brancherRecherche(id, F, k) { const el = $('#' + id); if (!el) return; el.oninput = debounce(ev => { F[k] = ev.target.value; router(); setTimeout(() => { const i = $('#' + id); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 250); }
const optsComFiltre = sel => opts([...S.commissions.filter(c => c.type === 'commission').map(c => [c.id, c.nom]), ['aucune', 'Sans commission']], sel, 'Toutes commissions');
const filtreCom = (m, F) => !F.com || (F.com === 'aucune' ? !m.commission_id : String(m.commission_id) === F.com);
const jauge = (titre, enc, att, extra = '', fmt = fcfa, lib = ['Attendu', 'Encaissé', 'Reste']) => `<div class="jauge"><div class="lig"><b>${titre}</b><b class="num">${pct(enc, att)} %</b></div>
  <div class="barre" role="img" aria-label="${pct(enc, att)} %"><i style="width:${Math.min(100, pct(enc, att))}%"></i></div>
  <div class="chiffres"><span>${lib[0]} <b>${fmt(att)}</b></span><span>${lib[1]} <b>${fmt(enc)}</b></span><span class="rest">${lib[2]} <b>${fmt(Math.max(0, att - enc))}</b></span>${extra}</div></div>`;

/* ---------- Tableau de bord */
VUES.tableau = () => {
  const e = exoM(); if (!e) return page('Tableau de bord', '', '', '<div class="alerte">Créez d\'abord une année de mensualités dans Paramètres.</div>');
  const c = camp();
  const fin = peut.finances();
  const mem = S.membres;
  const actifs = mem.filter(m => m.statut === 'actif');
  const aTraiter = S.formRep.filter(r => ['doublon', 'erreur'].includes(r.statut)).length;
  const alerteForm = aTraiter ? `<div class="alerte">${aTraiter} réponse${aTraiter > 1 ? 's' : ''} du formulaire à vérifier. <a href="#/formulaire">Les traiter</a></div>` : '';
  // ----- sondage (membres actifs)
  const garcons = actifs.filter(m => m.genre === 'Homme').length, filles = actifs.filter(m => m.genre === 'Femme').length, sansGenre = actifs.length - garcons - filles;
  const parCat = [...CATEGORIES.map(k => [k, actifs.filter(m => m.categorie === k).length]), ['Non renseignée', actifs.filter(m => !m.categorie).length]].filter(([k, v]) => v || k !== 'Non renseignée');
  const parCom = S.commissions.filter(x => x.type === 'commission' && x.actif).map(x => [x.nom, actifs.filter(m => m.commission_id === x.id).length]);
  const sansCom = actifs.filter(m => !m.commission_id).length; if (sansCom) parCom.push(['Sans commission', sansCom]);
  const barres = l => { const mx = Math.max(1, ...l.map(x => x[1])); return `<div class="barres-h">${l.map(([n, v]) => `<div><span title="${h(n)}">${h(n)}</span><i style="width:${v / mx * 100}%"></i><b>${v}</b></div>`).join('')}</div>`; };
  const gf = `<div class="gf"><div><b>${garcons}</b><span>Garçons</span><small>${pct(garcons, actifs.length)} %</small></div><div><b>${filles}</b><span>Filles</span><small>${pct(filles, actifs.length)} %</small></div></div>
    <div class="gf-barre" title="${garcons} garçons, ${filles} filles"><i style="width:${pct(garcons, actifs.length)}%"></i><i style="width:${pct(filles, actifs.length)}%"></i></div>
    ${sansGenre ? `<p class="muted" style="font-size:.85rem;margin:8px 0 0">${sansGenre} membre${sansGenre > 1 ? 's' : ''} sans genre renseigné</p>` : ''}`;
  const sondage = `<div class="grille g3">
    <section class="panneau"><h2>Garçons et filles</h2>${gf}</section>
    <section class="panneau"><h2>Par catégorie</h2>${barres(parCat)}</section>
    <section class="panneau"><header><h2>Par commission</h2><a href="#/commissions">Voir</a></header>${barres(parCom)}</section></div>`;
  EXPORTS.sondage = () => ({ nom: 'MMW_sondage_' + AUJ, titre: `Répartition des membres actifs au ${dateFr(AUJ)}`, entetes: ['Répartition', 'Groupe', 'Membres', '%'], lignes: [
    ['Genre', 'Garçons', garcons, pct(garcons, actifs.length)], ['Genre', 'Filles', filles, pct(filles, actifs.length)], ...(sansGenre ? [['Genre', 'Non renseigné', sansGenre, pct(sansGenre, actifs.length)]] : []),
    ...parCat.map(([k, v]) => ['Catégorie', k, v, pct(v, actifs.length)]), ...parCom.map(([k, v]) => ['Commission', k, v, pct(v, actifs.length)]), ['Total', 'Membres actifs', actifs.length, 100]] });
  const nouveaux = mem.filter(m => (m.date_adhesion || '').slice(0, 10) >= e.date_debut && (m.date_adhesion || '').slice(0, 10) <= e.date_fin);
  if (!fin) {
    return page('Tableau de bord', h(e.libelle), `${selAnnee()}${boutonsExport('sondage')}`, `${alerteForm}
      <dl class="bande treillis" style="--n:2"><div><dt>Membres actifs</dt><dd>${actifs.length}</dd><small>${mem.length} inscrits</small></div>
      <div><dt>Nouveaux cette année</dt><dd>${nouveaux.length}</dd></div></dl>${sondage}`);
  }
  const sit = actifs.map(m => [m, situation(m)]);
  const T = k => somme(sit, ([, s]) => s[k]);
  const courant = sit.map(([, s]) => s.courant).filter(Boolean);
  const payesMois = courant.filter(x => x.reste === 0).length;
  const lim = courant[0]?.date_limite;
  const recettes = somme(S.paiements.filter(p => !p.annule && p.date_paiement >= e.date_debut && p.date_paiement <= e.date_fin), p => p.montant);
  const depenses = somme(S.depenses.filter(d => !d.annule && d.date_depense >= e.date_debut && d.date_depense <= e.date_fin), d => d.montant);
  // ----- mensualités : encaissé / prévision, mois par mois
  const echM = S.echeances.filter(x => x.exercice_id === e.id && x.nature === 'mensualite' && !x.annulee);
  const mois = moisExercice(e).map(k => { const l = echM.filter(x => x.periode === k); const prevu = somme(l, x => x.montant_du), enc = somme(l, x => x.paye);
    return { k, prevu, enc, reste: prevu - enc, nb: l.length, ok: l.filter(x => x.reste === 0 && x.montant_du > 0).length }; });
  const P = k => somme(mois, x => x[k]);
  EXPORTS.mensPrev = () => ({ nom: 'MMW_mensualites_encaisse_prevision_' + e.libelle.replace(/\W+/g, '_'), titre: `${e.libelle} : encaissé / prévisions au ${dateFr(AUJ)}`,
    entetes: ['Mois', 'Prévision', 'Encaissé', 'Reste', 'Taux (%)', 'Membres à jour', 'Membres concernés'],
    lignes: [...mois.map(x => [moisLong(x.k), x.prevu, x.enc, x.reste, pct(x.enc, x.prevu), x.ok, x.nb]), ['Total', P('prevu'), P('enc'), P('reste'), pct(P('enc'), P('prevu')), '', '']] });
  const mx = Math.max(1, ...mois.map(x => x.prevu)), H = 150, W = Math.max(360, mois.length * 56);
  const graphe = `<div class="legende"><span><i style="background:var(--bleu-pale);border:1px solid var(--bleu-2)"></i>Prévision</span><span><i style="background:var(--vert)"></i>Encaissé</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H + 24}" width="${W}" height="${H + 24}" role="img" aria-label="Mensualités encaissées et prévues par mois">
    ${mois.map((x, i) => { const X = i * 56 + 8, hp = x.prevu / mx * H, he = x.enc / mx * H;
      return `<rect x="${X}" y="${H - hp}" width="40" height="${hp}" rx="4" fill="var(--bleu-pale)" stroke="var(--bleu-2)" stroke-width="1"><title>${moisLong(x.k)} — prévision ${fcfa(x.prevu)}</title></rect>
      <rect x="${X + 6}" y="${H - he}" width="28" height="${he}" rx="3" fill="var(--vert)"><title>${moisLong(x.k)} — encaissé ${fcfa(x.enc)}</title></rect>
      <text x="${X + 20}" y="${H + 16}" text-anchor="middle">${MC[+x.k.slice(5) - 1]}</text>`; }).join('')}</svg></div>`;
  const derniers = [...S.paiements].filter(p => !p.annule).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 6);
  EXPORTS.indic = () => ({ nom: 'MMW_tableau_de_bord_' + AUJ, titre: `Tableau de bord au ${dateFr(AUJ)}`, entetes: ['Indicateur', 'Valeur'], lignes: [
    ['Membres actifs', actifs.length], ['Adhérents inscrits', mem.length], ['Garçons', garcons], ['Filles', filles],
    ...parCat.map(([k, v]) => ['Catégorie ' + k, v]), ...parCom.map(([k, v]) => ['Commission ' + k, v]),
    ['Mensualités ' + e.libelle + ' : prévision sur l\'année', P('prevu')], ['Mensualités encaissées', P('enc')], ['Mensualités restant à encaisser', P('reste')],
    ['Mensualité de ' + moisLong(moisCourant) + ' : membres à jour', payesMois], ['Mensualité de ' + moisLong(moisCourant) + ' : membres concernés', courant.length],
    ['Cotisation ' + (c?.libelle || '') + ' attendue', T('sassDu')], ['Cotisation encaissée', T('sassPaye')], ['Cotisation restant à recouvrer', T('sassReste')],
    ['Recettes ' + e.libelle, recettes], ['Dépenses ' + e.libelle, depenses], ['Caisse (recettes − dépenses)', recettes - depenses]] });
  return page('Tableau de bord', `Situation au ${dateFr(AUJ)}`, `${selAnnee()}${selCamp()}${boutonsExport('indic')}`, `${alerteForm}
  <dl class="bande treillis" style="--n:4">
    <div><dt>Membres actifs</dt><dd>${actifs.length}</dd><small>${garcons} garçons · ${filles} filles</small></div>
    <div><dt>Mensualité de ${moisLong(moisCourant)}</dt><dd>${payesMois}<span style="font-size:1rem;opacity:.75"> / ${courant.length}</span></dd><small>${lim ? (AUJ <= lim ? 'à payer avant le ' + dateFr(lim) : 'membres à jour · date limite dépassée') : 'membres à jour'}</small></div>
    <div><dt>Cotisation ${h(c?.libelle || 'annuelle')}</dt><dd>${pct(T('sassPaye'), T('sassDu'))} %</dd><small>${fcfa(T('sassPaye'))} sur ${fcfa(T('sassDu'))}</small></div>
    <div><dt>Caisse ${h(e.libelle.replace(/^Mensualités\s*/, ''))}</dt><dd>${fcfa(recettes - depenses)}</dd><small>${fcfa(recettes)} reçus − ${fcfa(depenses)} dépensés</small></div>
  </dl>
  <section class="panneau"><header><h2>Mensualités ${h(e.libelle.replace(/^Mensualités\s*/, ''))} : encaissé / prévisions</h2><div class="outils">${boutonsExport('mensPrev', true)}</div></header>
    <div class="gf" style="margin-bottom:6px"><div><b>${fcfa(P('enc'))}</b><span>encaissé</span></div><div><b>${fcfa(P('prevu'))}</b><span>prévu sur l'année</span></div><div><b>${pct(P('enc'), P('prevu'))} %</b><span>réalisé</span></div></div>
    ${graphe}
    <div class="tab-wrap mt"><table><thead><tr><th>Mois</th><th class="n">Prévision</th><th class="n">Encaissé</th><th class="n">Reste</th><th class="n">Taux</th><th class="n">À jour</th></tr></thead>
    <tbody>${mois.map(x => `<tr${x.k === moisCourant ? ' style="font-weight:600"' : ''}><td>${moisLong(x.k)}</td><td class="n">${fcfa(x.prevu)}</td><td class="n">${fcfa(x.enc)}</td><td class="n">${fcfa(x.reste)}</td><td class="n">${pct(x.enc, x.prevu)} %</td><td class="n">${x.ok} / ${x.nb}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${fcfa(P('prevu'))}</td><td class="n">${fcfa(P('enc'))}</td><td class="n">${fcfa(P('reste'))}</td><td class="n">${pct(P('enc'), P('prevu'))} %</td><td></td></tr></tfoot></table></div>
  </section>
  <div class="entete mt" style="margin-bottom:10px"><div><h2 style="margin:0">Sondage des membres</h2></div><div class="outils">${boutonsExport('sondage', true)}</div></div>
  ${sondage}
  <section class="panneau mt"><header><h2>Derniers encaissements</h2><a href="#/encaissements">Tout voir</a></header>
    <ul class="liste-ops">${derniers.map(p => { const m = S.idx.membre.get(p.membre_id); return `<li data-pay="${p.id}" style="cursor:pointer"><span>${h(nomComplet(m))}<br><small class="muted">${h(NATURES[p.nature])} · ${dateFr(p.date_paiement)}</small></span>
      <span class="num"><b>${fcfa(p.montant)}</b></span></li>`; }).join('') || '<li class="muted">Aucun encaissement pour le moment.</li>'}</ul>
  </section>`);
};
function listeImpayes(membres, e = exoM()) {
  const lignes = membres.map(m => [m, situation(m, e)]).filter(([, s]) => s.arrieresTotal > 0 || s.mensArr > 0 || s.sassArr > 0)
    .map(([m, s]) => [m.matricule, nomComplet(m), m.telephone || '', S.idx.com.get(m.commission_id)?.nom || '', s.moisImpayes.map(x => moisCourt(x.periode)).join(', '), s.mensArr, s.sassArr, s.arrieresTotal, ETATS[s.etat][0]]);

}

    lignes: liste.map(m => [m.matricule, m.nom, m.prenom, m.genre, m.categorie || '', m.telephone, m.adresse, m.activite, m.domaine, S.idx.com.get(m.commission_id)?.nom || '', fonctions(m.id).join(', '), m.mensualite, dateFr(m.date_adhesion), m.statut, ...(fin ? [situation(m).carteStatut, situation(m).arrieresTotal] : [])]) });

    <div class="filtres">${recherche('fQ', F.q, 'Nom, matricule, téléphone…')}
      <select id="fCom" aria-label="Commission">${optsComFiltre(F.com)}</select>
      <select id="fCat" aria-label="Catégorie">${opts([...CATEGORIES, ['aucune', 'Sans catégorie']], F.cat, 'Toutes catégories')}</select>
      <select id="fGenre" aria-label="Genre">${opts(['Homme', 'Femme'], F.genre, 'Hommes et femmes')}</select>
      <select id="fAct" aria-label="Activité">${opts(['Etudiants', 'Professionnels'], F.act, 'Toutes activités')}</select>
      ${fin ? `<select id="fCarte" aria-label="Carte">${opts([['payée', 'Carte payée'], ['non payée', 'Carte non payée'], ['annulée', 'Carte annulée']], F.carte, 'Toutes cartes')}</select>
      <select id="fEtat" aria-label="Paiements">${opts(Object.entries(ETATS).map(([k, v]) => [k, v[0]]), F.etat, 'Tous paiements')}</select>` : ''}
      <select id="fStatut" aria-label="Statut">${opts([['actif', 'Actifs'], ['inactif', 'Inactifs']], F.statut, 'Actifs et inactifs')}</select></div>
    <div class="tab-wrap"><table><thead><tr>${th('numero', 'Matricule')}${th('nom', 'Membre')}<th>Téléphone</th><th>Catégorie</th><th>Commission</th>${th('adhesion', 'Adhésion')}${fin ? `<th>Carte</th>${th('arr', 'Arriérés', 'n')}<th>Paiements</th>` : ''}</tr></thead><tbody>
    ${liste.map(m => { const fn = fonctions(m.id); const s = fin ? situation(m) : null; return `<tr class="clic" data-href="#/membre/${m.id}">
      <td class="num">${h(m.matricule)}</td><td><b>${h(nomComplet(m))}</b>${fn.length ? `<br><small class="pas bl">${h(fn.join(', '))}</small>` : ''}${m.statut === 'inactif' ? ' <span class="pas neutre">inactif</span>' : ''}</td>

VUES.membres.apres = () => {

function formMembre(m = null) {
  const v = m || { mensualite: 2000, date_adhesion: new Date().toISOString(), statut: 'actif' };
  const pv = (m && S.prive.get(m.id)) || {};
  modale(m ? 'Modifier la fiche' : 'Ajouter un membre', `
    <div class="deux">${champ('Prénom', `<input name="prenom" required value="${h(v.prenom)}">`)}${champ('Nom', `<input name="nom" required value="${h(v.nom)}">`)}</div>
    <div class="deux">${champ('Genre', `<select name="genre" required>${opts(['Homme', 'Femme'], v.genre, '—')}</select>`)}${champ('Téléphone', `<input name="telephone" required inputmode="tel" value="${h(v.telephone)}">`)}</div>
    ${champ('Adresse', `<input name="adresse" value="${h(v.adresse)}">`)}
    <div class="deux">${champ('Activité', `<select name="activite">${opts(['Etudiants', 'Professionnels'], v.activite, '—')}</select>`)}${champ('Domaine d\'activité', `<input name="domaine" value="${h(v.domaine)}">`)}</div>
    <div class="deux">${champ('Catégorie', `<select name="categorie">${opts(CATEGORIES, v.categorie, '—')}</select>`)}${champ('Commission', `<select name="commission_id">${optsCommissions(v.commission_id, 'commission')}</select>`)}</div>
    <div class="deux">${champ('Mensualité (FCFA)', `<input name="mensualite" type="number" min="0" step="500" value="${h(v.mensualite)}" required>`, m ? 'Un changement s\'applique aux mois non encore réglés.' : '')}<span></span></div>
    ${peut.prive() ? `<div class="deux">${champ('Groupe sanguin', `<select name="groupe_sanguin">${opts(['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'], pv.groupe_sanguin, '—')}</select>`)}${champ('Contact d\'urgence', `<input name="contact_urgence" value="${h(pv.contact_urgence)}">`)}</div>
    ${champ('Données relatives à la santé (confidentiel)', `<input name="sante" value="${h(pv.sante)}">`)}` : ''}
    <div class="deux">${champ('Date d\'adhésion', `<input name="date_adhesion" type="date" value="${iso(v.date_adhesion)}" max="${AUJ}" required>`)}${champ('Statut', `<select name="statut">${opts([['actif', 'Actif'], ['inactif', 'Inactif']], v.statut)}</select>`, 'Inactif : ses échéances futures non payées sont annulées.')}</div>
    ${champ('Notes internes', `<textarea name="notes">${h(v.notes)}</textarea>`)}`, {
    onSubmit: async d => {
      const tel = (d.telephone || '').replace(/\D/g, '');
      if (tel.length < 7) throw new Error('Numéro de téléphone invalide.');
      if (d.date_adhesion > AUJ) throw new Error('La date d\'adhésion ne peut pas être dans le futur.');
      const vals = { prenom: d.prenom.trim(), nom: d.nom.trim(), genre: d.genre || null, telephone: d.telephone.trim(), adresse: d.adresse || null, activite: d.activite || null, domaine: d.domaine || null,
        commission_id: d.commission_id ? Number(d.commission_id) : null, categorie: d.categorie || null, mensualite: Number(d.mensualite), date_adhesion: d.date_adhesion + 'T12:00:00Z', statut: d.statut, notes: d.notes || null };
      const prive = peut.prive() ? { sante: d.sante || null, groupe_sanguin: d.groupe_sanguin || null, contact_urgence: d.contact_urgence || null } : null;
      if (!m) {
        const t9 = tel.slice(-9);
        const proche = S.membres.find(x => x.telephone_norm === t9 || (norm(x.nom) === norm(vals.nom) && norm(x.prenom) === norm(vals.prenom)));
        if (proche && !confirm(`Doublon possible : ${nomComplet(proche)} (${proche.matricule}) a le même téléphone ou le même nom.\n\nCréer quand même une NOUVELLE fiche ?`)) return false;
        const [n] = await ins('membres', { ...vals, source: 'manuel' });
        if (prive) await S.sb.from('membres_prive').upsert({ membre_id: n.id, ...prive });
        await rafraichir('Membre ajouté : ' + n.matricule + ' (échéances générées)'); location.hash = '#/membre/' + n.id;
      } else {
        await maj('membres', m.id, vals);
        if (prive) { const { error } = await S.sb.from('membres_prive').upsert({ membre_id: m.id, ...prive }); if (error) throw error; }
        await rafraichir('Fiche enregistrée');
      }
    }
  });

async function chargerHisto(mid) {
  const { data } = await S.sb.from('historique_affectations').select('*').eq('membre_id', mid).order('modifie_le');
  if (data && data.length && data.length !== S.histo.filter(x => x.membre_id === mid).length) { S.histo = [...S.histo.filter(x => x.membre_id !== mid), ...data]; router(); }
}
function formEngagement(m) {
  const e = camp(); const cur = S.idx.eng.get(m.id + '|' + e.id); const s = situation(m);
  modale(`Cotisation ${e.libelle} — ${nomComplet(m)}`, `
    <p style="margin:0">Montant fixé par le dahira pour cette campagne : <b>${fcfa(e.sass_montant)}</b>${e.sass_montant ? ` (${tranches(e).map(t => fcfa(t.montant)).join(' + ')})` : ''}.</p>
    <p class="muted" style="margin:0">Un montant personnalisé remplace ce montant pour ce membre ; il est réparti sur les 3 tranches dans les mêmes proportions. Impossible une fois la cotisation entamée.</p>
    ${champ('Montant annuel personnalisé (FCFA)', `<input name="montant" type="number" min="0" step="500" value="${cur?.montant ?? ''}" placeholder="vide = montant de la campagne">`)}
    ${champ('Motif', `<input name="motif" value="${h(cur?.motif || '')}" placeholder="ex. engagement personnel, exonération…">`)}
    ${s.sassPaye ? '<div class="alerte rouge">Cotisation déjà entamée : la base refusera la modification.</div>' : ''}`, {
    onSubmit: async v => {
      if (v.montant === '') { if (cur) { const { error } = await S.sb.from('engagements').delete().eq('id', cur.id); if (error) throw error; } }
      else if (cur) await maj('engagements', cur.id, { montant: Number(v.montant), motif: v.motif || null });
      else await ins('engagements', { membre_id: m.id, exercice_id: e.id, montant: Number(v.montant), motif: v.motif || null });
      await rafraichir('Cotisation annuelle mise à jour');
    }
  });
}
function imprimerSituation(m) {
  const blocs = S.exercices.map(e => [e, e.type === 'cotisation' ? situation(m, null, e) : situation(m, e, null)]).filter(([, s]) => s.mens.length || s.sass.length);
  const pay = (S.idx.pay.get(m.id) || []).sort((a, b) => a.date_paiement.localeCompare(b.date_paiement));
  fenetreImpression('Situation ' + m.matricule, `<h1>Situation individuelle — ${h(nomComplet(m))}</h1>
    <p>Matricule ${h(m.matricule)} · ${h(S.idx.com.get(m.commission_id)?.nom || 'sans commission')} · adhésion ${dateFr(m.date_adhesion)} · mensualité ${fcfa(m.mensualite)} · tél. ${h(m.telephone || '')}<br>
    Carte de membre : ${situation(m).carte ? 'payée le ' + dateFr(situation(m).carte.date_paiement) : 'non payée'} · Arriérés cumulés au ${dateFr(AUJ)} : <b>${fcfa(situation(m).arrieresTotal)}</b></p>

}

/* ---------- Relances */
function messageRelance(type, m, data) {
  const modele = param({ rappel: 'msg_rappel', retard: 'msg_retard', tranche: 'msg_tranche' }[type]);
  const v = { prenom: m.prenom, nom: m.nom, matricule: m.matricule, sigle: param('sigle', 'MMW'), association: nomAsso(), ...data };
  return modele.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
}
VUES.relances = () => {

  if (F.onglet === 'diffusion') return vueDiffusion(F);
  const actifs = S.membres.filter(m => m.statut === 'actif' && filtreCom(m, F));
  const derniere = (mid, type) => (S.idx.rel.get(mid) || []).filter(r => r.type === type).at(-1);
  // Relances : toutes les échéances ouvertes, quel que soit l'exercice
  const ouvertes = m => (S.idx.ech.get(m.id) || []).filter(x => !x.annulee && x.reste > 0);
  const exDe = x => S.exercices.find(y => y.id === x.exercice_id);
  let rows = [];
  if (F.onglet === 'rappel') rows = actifs.flatMap(m => ouvertes(m).filter(x => x.nature === 'mensualite' && x.periode === moisCourant && !echu(x))
    .map(c => ({ m, ech: c, montant: c.reste, info: `${moisLong(c.periode)} · limite ${dateFr(c.date_limite)}`, msg: messageRelance('rappel', m, { mois: moisLong(c.periode), montant: fcfa(c.reste), date_limite: dateFr(c.date_limite) }) })));
  else if (F.onglet === 'retard') rows = actifs.map(m => [m, ouvertes(m).filter(x => x.nature === 'mensualite' && echu(x)).sort((a, b) => a.mois.localeCompare(b.mois))]).filter(([, l]) => l.length)
    .map(([m, l]) => { const arr = situation(m).arrieresTotal; return { m, ech: l.at(-1), montant: arr, info: `${l.length} mois : ${l.map(x => moisCourt(x.periode)).join(', ')}`,
      msg: messageRelance('retard', m, { mois: moisLong(l.at(-1).periode), montant: fcfa(l.at(-1).reste), arrieres: fcfa(arr), date_limite: dateFr(l.at(-1).date_limite) }) }; });
  else rows = actifs.flatMap(m => ouvertes(m).filter(x => x.nature === 'sass' && x.date_limite <= iso(Date.now() + 30 * 864e5)).map(x => ({ m, ech: x, montant: x.reste,
      info: `${tranches(exDe(x))[x.tranche - 1].libelle} ${exDe(x)?.libelle || ''} · limite ${dateFr(x.date_limite)}${echu(x) ? ' (dépassée)' : ''}`,
      msg: messageRelance('tranche', m, { tranche: tranches(exDe(x))[x.tranche - 1].libelle, montant: fcfa(x.reste), date_limite: dateFr(x.date_limite), arrieres: fcfa(situation(m).arrieresTotal) }) })));

    lignes: rows.map(r => [r.m.matricule, nomComplet(r.m), r.m.telephone || '', r.info, r.montant, derniere(r.m.id, F.onglet) ? dateFr(derniere(r.m.id, F.onglet).created_at) : '', r.msg]) });
  return page('Relances', 'Messages prêts à envoyer par WhatsApp depuis votre téléphone ; chaque envoi est noté ici. Le rappel automatique du mois se règle dans Paramètres.', boutonsExport('rel', true), `
    <div class="onglets" role="tablist">${ONGLETS_REL(e).map(([k, l]) => `<button role="tab" data-onglet="${k}" aria-selected="${F.onglet === k}">${l}</button>`).join('')}</div>
    <div class="filtres"><select id="fCom" aria-label="Commission">${optsComFiltre(F.com)}</select>
      ${rows.length && peut.relancer() ? `<button class="btn" id="btToutes">Marquer les ${rows.length} comme relancés</button>` : ''}</div>
    <div class="tab-wrap"><table><thead><tr><th>Membre</th><th>Détail</th><th class="n">Montant</th><th>Dernière relance</th><th></th></tr></thead><tbody>
    ${rows.map((r, i) => { const d = derniere(r.m.id, F.onglet); return `<tr><td><a href="#/membre/${r.m.id}">${h(nomComplet(r.m))}</a><br><small class="muted">${h(r.m.telephone || 'pas de téléphone')}</small></td><td>${h(r.info)}</td><td class="n">${fcfa(r.montant)}</td>
      <td>${d ? `<span class="pas ${d.created_at.slice(0, 10) === AUJ ? 'ok' : 'neutre'}">${dateFr(d.created_at)}</span>` : '<span class="muted">jamais</span>'}</td>
      <td style="white-space:nowrap">${peut.relancer() && r.m.telephone_norm ? `<button class="btn petit vert" data-wa="${i}">${ico('wa')} WhatsApp</button> ` : ''}<button class="btn petit" data-copie="${i}">Copier</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="vide">Personne à relancer dans cette catégorie.</td></tr>'}

function apresDiffusion(F) {
  const dest = VUES.relances.dest;
  $$('[data-onglet]').forEach(b => b.onclick = () => { F.onglet = b.dataset.onglet; router(); });
  const chg = (id, k) => { const el = $('#' + id); if (el) el.onchange = ev => { F[k] = ev.target.value; F.pos = 0; router(); }; };
  chg('fCom', 'com'); chg('dCat', 'cat'); chg('dGenre', 'genre'); chg('dCible', 'cible');
  const zone = $('#dMsg'); zone.oninput = () => { const avant = !!F.msg.trim(); F.msg = zone.value; try { localStorage.setItem('mmw_diffusion', F.msg); } catch {}
    if (avant !== !!F.msg.trim()) { const pos = zone.selectionStart; router(); setTimeout(() => { const z = $('#dMsg'); z.focus(); z.setSelectionRange(pos, pos); }); } };
  const envoyer = m => { const txt = persoMsg(F.msg, m); window.open(`https://wa.me/221${m.telephone_norm}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');

/* ---------- Import du modèle Excel (administrateur) */
const MOIS_NORM = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
const nombre = v => { if (v == null || v === '') return null; if (typeof v === 'number') return Math.round(v); const n = String(v).replace(/[^\d,.-]/g, '').replace(',', '.'); return n ? Math.round(Number(n)) : null; };
const dateImport = v => {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === 'number') return iso(new Date(Math.round((v - 25569) * 864e5)));
  const m = String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0, 10) : null;
};
function lireClasseur(wb) {
  const lignes = [], alertes = [];
  const feuille = motif => { const n = wb.SheetNames.find(x => norm(x).includes(motif)); return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }) : null; };
  const entetes = rows => { const i = rows.findIndex(r => r.some(c => ['matricule', 'datejjmmaaaa', 'date'].includes(norm(c)))); return i < 0 ? null : { i, h: rows[i].map(c => norm(c)) }; };
  const col = (h, test) => h.findIndex(x => typeof test === 'string' ? x === test : test.test(x));
  const parNumero = new Map(S.membres.map(m => [m.numero, m]));
  const matricule = v => { const n = Number(String(v ?? '').replace(/\D/g, '')); return n ? 'MMW-' + String(n).padStart(4, '0') : null; };
  const verifier = (mat, feuilleNom, r) => { if (!parNumero.has(Number(mat?.replace(/\D/g, '')))) { alertes.push(`${feuilleNom}, ligne ${r} : matricule ${mat || '(vide)'} inconnu`); return false; } return true; };
  let rowsA = feuille('adherent');
  if (rowsA) { const E = entetes(rowsA); if (E) {
    const c = k => col(E.h, k), cM = c('matricule'), cP = col(E.h, /^prenom/), cN = c('nom'), cG = c('genre'), cC = col(E.h, /^categorie/), cT = col(E.h, /^telephone/),
      cCom = col(E.h, /^commission/), cMe = col(E.h, /^mensualite/), cD = col(E.h, /^date/), cA = c('adresse'), cAc = col(E.h, /^activite/);
    const v = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    const cats = new Map(CATEGORIES.map(x => [norm(x), x])); cats.set('soxna', 'Soxna yi'); cats.set('autre', 'Autres');
    const coms = new Set(S.commissions.map(x => norm(x.nom)));
    rowsA.slice(E.i + 1).forEach((r, k) => { const L = E.i + k + 2, pr = v(r, cP), no = v(r, cN); if (!pr && !no) return;
      if (!pr || !no) { alertes.push(`Adhérents, ligne ${L} : prénom ou nom manquant`); return; }
      const cat = v(r, cC); if (cat && !cats.has(norm(cat))) { alertes.push(`Adhérents, ligne ${L} : catégorie « ${cat} » inconnue (${CATEGORIES.join(', ')})`); return; }
      const com = v(r, cCom); if (com && !coms.has(norm(com))) { alertes.push(`Adhérents, ligne ${L} : commission « ${com} » inconnue`); return; }
      const mat = matricule(r[cM]); if (mat) parNumero.set(Number(mat.replace(/\D/g, '')), true);
      lignes.push({ type: 'adherent', matricule: mat, prenom: pr, nom: no, genre: v(r, cG), categorie: cat ? cats.get(norm(cat)) : '', telephone: v(r, cT), commission: com,
        mensualite: nombre(r[cMe]), date: dateImport(r[cD]), adresse: v(r, cA), activite: v(r, cAc) }); }); } }
  let rows = feuille('mensualite');
  if (rows) { const E = entetes(rows); if (E) { const cM = col(E.h, 'matricule'), cMens = col(E.h, 'mensualite'), cMode = col(E.h, 'mode');
    rows.slice(E.i + 1).forEach((r, k) => { const mat = matricule(r[cM]); if (!mat) return; if (!verifier(mat, 'Mensualités', E.i + k + 2)) return;
      const mode = cMode >= 0 ? r[cMode] : null;
      if (cMens >= 0 && nombre(r[cMens])) lignes.push({ type: 'mensualite_montant', matricule: mat, montant: nombre(r[cMens]) });
      MOIS_NORM.forEach((mn, j) => { const c = col(E.h, mn); const v = c >= 0 ? nombre(r[c]) : null; if (v > 0) lignes.push({ type: 'mensualite', matricule: mat, mois: j + 1, montant: v, mode }); }); }); } }
  rows = feuille('cotisation');
  if (rows) { const E = entetes(rows); if (E) { const cM = col(E.h, 'matricule'), cA = col(E.h, /montantannuel/), cMode = col(E.h, 'mode');
    const cT = [1, 2, 3].map(t => col(E.h, new RegExp('verse.*' + t)));
    rows.slice(E.i + 1).forEach((r, k) => { const mat = matricule(r[cM]); if (!mat) return; const a = cA >= 0 ? nombre(r[cA]) : null; const vs = cT.map(c => c >= 0 ? nombre(r[c]) : null);
      if (a == null && !vs.some(v => v > 0)) return; if (!verifier(mat, 'Cotisation', E.i + k + 2)) return;

      vs.forEach((v, t) => { if (v > 0) lignes.push({ type: 'sass', matricule: mat, tranche: t + 1, montant: v, mode: cMode >= 0 ? r[cMode] : null }); }); }); } }
  rows = feuille('carte');
  if (rows) { const E = entetes(rows); if (E) { const cM = col(E.h, 'matricule'), cV = col(E.h, /montant/), cD = col(E.h, /^date/), cMode = col(E.h, 'mode');
    rows.slice(E.i + 1).forEach((r, k) => { const mat = matricule(r[cM]); const v = cV >= 0 ? nombre(r[cV]) : null; if (!mat || !(v > 0)) return; if (!verifier(mat, 'Cartes', E.i + k + 2)) return;

async function sauvegarde(fmt) {

  const { data: prof, error } = await S.sb.from('profils').select('*').eq('user_id', S.user.id).maybeSingle();
  if (error) { ecranConnexion('Base non initialisée : exécutez 01_schema.sql dans Supabase. (' + error.message + ')'); return; }
  if (!prof || !prof.actif) { await S.sb.auth.signOut(); ecranConnexion(prof ? 'Votre accès a été suspendu par un administrateur.' : 'Compte sans profil : demandez à un administrateur.'); return; }
  S.profil = prof;
  $('#racine').innerHTML = '<div class="chargement">Chargement des données…</div>';
  try { await charger(); } catch (e) { erreur(e); $('#racine').innerHTML = '<div class="chargement"><div><p>Impossible de charger les données.</p><button class="btn prim" onclick="location.reload()">Réessayer</button></div></div>'; return; }
  coquille(); router(); tempsReel();
}
let canal = null;
function tempsReel() {
  if (canal) return; const recharge = debounce(() => rafraichir().catch(() => {}), 1000);
  canal = S.sb.channel('mmw').on('postgres_changes', { event: '*', schema: 'public', table: 'paiements' }, recharge)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'membres' }, recharge).on('postgres_changes', { event: '*', schema: 'public', table: 'form_reponses' }, recharge).subscribe();
}
function demarrer() {
  appliquerTheme();
  S.env = /[?&]env=test/.test(location.search) || /(^|\.)(test|preview)[.-]/.test(location.hostname) ? 'test' : 'production';
  let cfg = CONFIG[S.env];
  if (!cfg?.SUPABASE_URL || !cfg?.SUPABASE_ANON_KEY) { try { cfg = JSON.parse(localStorage.getItem('mmw_cfg_' + S.env) || '{}'); } catch { cfg = {}; } }
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return ecranConfig();
  if (!window.supabase) return mmwSecours('La bibliothèque Supabase n\'a pas pu être téléchargée : vérifiez votre connexion internet, puis réessayez.');
  const urlB = String(cfg.SUPABASE_URL).trim().replace(/\/$/, '');
  if (!/^https?:\/\/[^\/\s]+$/i.test(urlB) || /supabase\.com$/i.test(urlB))
    return mmwSecours('L\'URL Supabase n\'est pas valide : « ' + h(cfg.SUPABASE_URL) + ' ». Elle doit ressembler à https://xxxx.supabase.co (Supabase › Project Settings › API › Project URL).');
  try {
    S.sb = window.supabase.createClient(String(cfg.SUPABASE_URL).trim().replace(/\/$/, ''), String(cfg.SUPABASE_ANON_KEY).trim(), { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mmw-auth-' + S.env } });
  } catch (e) { return mmwSecours('Connexion à Supabase impossible : ' + h(e.message)); }
  let enCours = null;
  S.sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') setTimeout(() => modale('Nouveau mot de passe', champ('Nouveau mot de passe', '<input type="password" name="mdp" minlength="8" required>'), { onSubmit: async v => { const { error } = await S.sb.auth.updateUser({ password: v.mdp }); if (error) throw error; toast('Mot de passe modifié'); } }), 300);
    if (session && (!S.user || S.user.id !== session.user.id)) { if (enCours) return; enCours = apresConnexion(session).finally(() => enCours = null); }
    else if (!session) { S.user = null; S.profil = null; if (canal) { S.sb.removeChannel(canal); canal = null; } ecranConnexion(); }
  });
}
demarrer();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
